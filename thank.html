/* FONTSPRING DEMO — The Seasons. Drop files into ./fonts/ (see index.html). */
@font-face{
  font-family:'The Seasons';
  src:url('fonts/Fontspring-DEMO-theseasons-reg.woff2') format('woff2'),
      url('fonts/Fontspring-DEMO-theseasons-reg.otf') format('opentype');
  font-weight:400;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'The Seasons';
  src:url('fonts/Fontspring-DEMO-theseasons-bd.woff2') format('woff2'),
      url('fonts/Fontspring-DEMO-theseasons-bd.otf') format('opentype');
  font-weight:700;font-style:normal;font-display:swap;
}
@font-face{
  font-family:'The Seasons';
  src:url('fonts/Fontspring-DEMO-theseasons-it.woff2') format('woff2'),
      url('fonts/Fontspring-DEMO-theseasons-it.otf') format('opentype');
  font-weight:400;font-style:italic;font-display:swap;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --gold:#c6a04f;--gold-soft:#d9bd80;--gold-deep:#b8923e;
  --wine:#8b1538;--wine-hover:#a01a42;--wine-deep:#6b0f2a;
  --sand:#f4e4d4;--forest:#0f4c3a;--charcoal:#1b211d;
  --ink:#1a1310;--ink-soft:#45443f;--ink-body:#5d5c54;--slate:#828583;
  --cream:#ffffff;--star:#f59e0b;
  --border:rgba(26,19,16,.12);
  --glass:rgba(255,255,255,.42);--glass-bd:rgba(255,255,255,.6);
  --blur:blur(16px) saturate(140%);
  --ease:cubic-bezier(.22,.61,.36,1);

  /* headings: The Seasons · body: Poppins · numerals: Cormorant Garamond */
  --head:'The Seasons','Cormorant Garamond',Georgia,serif;
  --display:'The Seasons','Cormorant Garamond',Georgia,serif;
  --script:'Cormorant Garamond','The Seasons',Georgia,serif;
  --num:'Cormorant Garamond',Georgia,serif;
  --sans:'Poppins',system-ui,sans-serif;
  --r-btn:8px;--r-card:14px;
}
html{scroll-behavior:smooth;background:var(--sand)}
body{
  font-family:var(--sans);background:transparent;color:var(--ink);
  overflow-x:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1100px 720px at 12% 16%,rgba(255,255,255,.80),transparent 62%),
    radial-gradient(900px 600px at 88% 26%,rgba(217,189,128,.42),transparent 60%),
    radial-gradient(1200px 820px at 72% 88%,rgba(139,21,56,.10),transparent 62%),
    linear-gradient(180deg,var(--sand) 0%,#f8ebdd 30%,#fdf6ef 62%,#ffffff 100%);
}
a{color:inherit;text-decoration:none}

.thank-wrap{
  position:relative;width:100%;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:3rem 1.5rem;
}
.thank-card{
  position:relative;z-index:2;text-align:center;max-width:580px;
  background:var(--glass);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
  border:1px solid var(--glass-bd);border-radius:var(--r-card);
  padding:4rem 3rem;box-shadow:0 20px 60px rgba(26,19,16,0.08);
}
.thank-icon{
  font-family:var(--script);font-size:3rem;color:var(--gold);
  margin-bottom:1rem;animation:bounceIn 0.6s ease;
}
@keyframes bounceIn{
  0%{transform:scale(0.3);opacity:0}
  50%{transform:scale(1.1)}
  100%{transform:scale(1);opacity:1}
}
.thank-title{
  font-family:var(--head);font-size:clamp(2rem,5vw,3rem);
  font-weight:700;color:var(--ink);margin-bottom:0.5rem;line-height:1.15;
}
.thank-title em{
  font-family:var(--script);font-style:italic;font-weight:600;color:var(--gold-deep);
}
.thank-line{width:32px;height:1.5px;background:var(--gold);margin:1.5rem auto}
.thank-body{
  font-size:0.95rem;color:var(--ink-body);line-height:1.8;margin-bottom:1.5rem;
}
.thank-body strong{color:var(--ink);font-weight:600}
.thank-note{
  font-size:0.85rem;color:var(--slate);font-style:italic;margin-bottom:2rem;
}
.thank-btn{
  display:inline-block;font-family:var(--sans);font-size:.7rem;font-weight:600;
  letter-spacing:.13em;text-transform:uppercase;padding:.9rem 2rem;
  border:1.5px solid var(--wine);border-radius:var(--r-btn);color:var(--wine);
  background:rgba(255,255,255,.32);
  -webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);
  transition:background .22s,color .22s,transform .2s;
}
.thank-btn:hover{background:var(--wine);color:#fff;transform:translateY(-1px)}
.thank-footer{
  margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--border);
  font-size:0.6rem;font-weight:500;letter-spacing:.08em;color:var(--slate);
}
@media(max-width:600px){.thank-card{padding:3rem 1.5rem;border-radius:12px}}
  </style>
</head>

<div class="thank-wrap">
  <div class="thank-card">
    <div class="thank-icon">✦</div>
    <h1 class="thank-title">Thank <em>You</em></h1>
    <div class="thank-line"></div>
    <p class="thank-body">
      Your enquiry has been received successfully.<br><br>
      A DestinationPick South Asian wedding specialist will be in touch within <strong>24 hours</strong> to craft your perfect celebration.
    </p>
    <p class="thank-note">We can't wait to help you plan the wedding of your dreams.</p>
    <a href="index.html" class="thank-btn">Back to Home</a>
    <div class="thank-footer">DestinationPick × Meliá Weddings</div>
  </div>
</div>

</body>
</html>
